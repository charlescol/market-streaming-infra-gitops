apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-binance-scraper
  namespace: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node-binance-scraper
  template:
    metadata:
      labels:
        app: node-binance-scraper
    spec:
      containers:
        - name: node
          image: node-binance-scraper:0.0.8
          ports:
            - containerPort: 3000
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: config-node-binance-scraper
