apiVersion: v1
kind: Service
metadata:
  name: node-binance-scraper-metrics
  namespace: backend
  labels:
    app: node-binance-scraper-metrics
spec:
  selector:
    app: node-binance-scraper
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      name: tcp-prometheus
  type: ClusterIP 
