apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: kafka-cluster
  namespace: backend
  annotations:
    strimzi.io/kraft: enabled
    strimzi.io/node-pools: enabled
spec:
  kafka:
    version: 3.9.0
    metadataVersion: 3.9-IV0
    listeners:
      - name: controller
        port: 9093
        type: internal
        tls: false
      - name: internal
        port: 9092
        type: internal
        tls: false
        configuration:
          brokers:
            - broker: 0
              advertisedHost: kafka-cluster-kafka-combined-pool-0.kafka-cluster-kafka-brokers.backend.svc.cluster.local
              advertisedPort: 9092
    config:
      auto.create.topics.enable: "true"
      delete.topic.enable: "true"
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      auto.leader.rebalance.enable: "true"
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      process.roles: "controller,broker"
      log.retention.check.interval.ms: 60000 # Check for log retention every 60 seconds
      compression.type: "uncompressed"
      min.insync.replicas: 1
      node.id: 1
      controller.quorum.voters: "1@kafka-cluster-kafka-0.kafka-cluster-kafka-brokers.kafka.svc.cluster.local:9093"
      controller.quorum.bootstrap.servers: "kafka-cluster-kafka-0.kafka-cluster-kafka-brokers.backend.svc.cluster.local:9093"
      controller.listener.names: "controller"
      offsets.topic.num.partitions: 10

    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: kafka-metrics
          key: kafka-metrics-config.yml

  entityOperator:
    topicOperator: {}
    userOperator: {}
