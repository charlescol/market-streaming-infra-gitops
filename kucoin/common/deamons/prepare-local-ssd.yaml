apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: prepare-local-ssd
  namespace: kube-system
  labels:
    app: prepare-local-ssd
spec:
  selector:
    matchLabels:
      app: prepare-local-ssd
  template:
    metadata:
      labels:
        app: prepare-local-ssd
    spec:
      tolerations:
        - operator: Exists
      containers:
        - name: prep
          image: registry.k8s.io/startup-script:v2
          securityContext:
            privileged: true
          env:
            - name: STARTUP_SCRIPT
              value: |
                set -euo pipefail

                base="/var/local-ssd"
                mkdir -p "${base}"

                i=0
                shopt -s nullglob

                # Handle NVMe and SCSI Google Local SSDs
                for dev in /dev/disk/by-id/google-local-ssd* /dev/disk/by-id/google-local-nvme-ssd* /dev/nvme*n1; do
                  [ -e "$dev" ] || continue

                  target="${base}/${i}"
                  mkdir -p "$target"

                  # If device already mounted somewhere, bind-mount it under ${base}/i
                  if findmnt -n -S "$dev" >/dev/null 2>&1; then
                    src="$(findmnt -n -S "$dev" -o TARGET)"
                    if ! mountpoint -q "$target"; then
                      mount --bind "$src" "$target"  # bind existing mount
                    fi
                  else
                    # If no filesystem, use XFS
                    if ! blkid "$dev" >/dev/null 2>&1; then
                      mkfs.xfs -f "$dev"
                    fi
                    if ! mountpoint -q "$target"; then
                      mount -o noatime,nodiratime "$dev" "$target"
                    fi
                  fi

                  i=$((i+1))
                done
          volumeMounts:
            # This is a writable area on COS/Ubuntu; we propagate mounts back to the host.
            - name: host-var-local-ssd
              mountPath: /var/local-ssd
              mountPropagation: Bidirectional
            # Ensure devices are visible in the container
            - name: host-dev
              mountPath: /dev
      volumes:
        - name: host-var-local-ssd
          hostPath:
            path: /var/local-ssd
            type: DirectoryOrCreate
        - name: host-dev
          hostPath:
            path: /dev
