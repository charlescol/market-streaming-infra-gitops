apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: flink-cluster
  namespace: backend
spec:
  image: asia-northeast1-docker.pkg.dev/market-streaming-prod/flink-microstructures-extractor/flink-microstructures-extractor:0.12.7 # {"$imagepolicy": "flux-system:flink-microstructures-extractor"}
  flinkVersion: v1_20
  serviceAccount: flink
  flinkConfiguration:
    # env.java.opts.taskmanager: >-
    #   -XX:+UseG1GC
    #   -XX:MaxGCPauseMillis=10
    #   -XX:InitiatingHeapOccupancyPercent=45
    #   -XX:+AlwaysPreTouch
    #   -Dscala.usejavacp=false
    #   -Dlog4j2.Script.enableLanguages=none
    #   -XX:G1NewSizePercent=25
    #   -XX:G1MaxNewSizePercent=50
    # env.java.opts.jobmanager: >-
    #   -XX:+UseG1GC
    #   -XX:MaxGCPauseMillis=50
    #   -XX:+AlwaysPreTouch
    #   -Dscala.usejavacp=false
    #   -Dlog4j2.Script.enableLanguages=none
    #   -XX:+UnlockExperimentalVMOptions
    #   -XX:+ExplicitGCInvokesConcurrent
    # --------------------------------------------------------------------
    # Metric reporter
    # --------------------------------------------------------------------
    metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
    metrics.reporter.prom.port: "8082"
    metrics.reporter.prom.class: org.apache.flink.metrics.prometheus.PrometheusReporter
    metrics.reporters: prom
    # --------------------------------------------------------------------
    # Fault-tolerance
    # --------------------------------------------------------------------
    restart-strategy.type: fixed-delay
    restart-strategy.fixed-delay.attempts: "3"
    restart-strategy.fixed-delay.delay: 5s
    cleanup-strategy.type: fixed-delay
    cleanup-strategy.fixed-delay.attempts: "3"
    cleanup-strategy.fixed-delay.delay: 5s
    # --------------------------------------------------------------------
    # State backend
    # --------------------------------------------------------------------
    state.backend.type: hashmap
    # --------------------------------------------------------------------
    # High availability
    # --------------------------------------------------------------------
    high-availability.type: kubernetes
    high-availability.storageDir: file:///flink-data/ha
    # --------------------------------------------------------------------
    # Execution
    # --------------------------------------------------------------------
    execution.runtime-mode: STREAMING
    execution.buffer-timeout.enabled: "true"
    execution.buffer-timeout.interval: 0ms
    # --------------------------------------------------------------------
    # Pipeline
    # --------------------------------------------------------------------
    pipeline.max-parallelism: "128"
    pipeline.auto-generate-uids: "false"
    # --------------------------------------------------------------------
    # Checkpointing (disabled)
    # --------------------------------------------------------------------
    execution.checkpointing.unaligned.enabled: "true"
    execution.checkpointing.aligned-checkpoint-timeout: 200ms
    execution.checkpointing.unaligned.forced: "false"
    execution.checkpointing.cleaner.parallel-mode: "true"
    execution.checkpointing.storage: filesystem
    execution.checkpointing.dir: file:///flink-data/checkpoints
    execution.checkpointing.savepoint-dir: file:///flink-data/savepoints
    execution.checkpointing.incremental: "true"
    execution.checkpointing.num-retained: "5"
    execution.checkpointing.tolerable-failed-checkpoints: "1"
    execution.checkpointing.externalized-checkpoint-retention: DELETE_ON_CANCELLATION
    execution.checkpointing.file-merging.max-space-amplification: "2"
    # execution.checkpointing.interval: 15s
    execution.checkpointing.max-concurrent-checkpoints: "1"
    execution.checkpointing.timeout: 15s
    execution.checkpointing.local-backup.enabled: "false"
    execution.checkpointing.mode: EXACTLY_ONCE
    execution.checkpointing.unaligned.max-subtasks-per-channel-state-file: "5"
    execution.checkpointing.snapshot-compression: "true"
    # --------------------------------------------------------------------
    # Pekko
    # --------------------------------------------------------------------
    pekko.framesize: "104857600b" # 100Mi
    # --------------------------------------------------------------------
    # Restauration / Recovery
    # --------------------------------------------------------------------
    execution.state-recovery.claim-mode: NO_CLAIM
    execution.state-recovery.from-local: "false"
    execution.state-recovery.ignore-unclaimed-state: "false"
    # --------------------------------------------------------------------
    # JobManager
    # --------------------------------------------------------------------
    jobstore.cache-size: "1048576"
    jobstore.max-capacity: "10"
    blob.storage.directory: file:///flink-data/blob-storage
    kubernetes.jobmanager.cpu.limit-factor: "1.5"
    # JVM non-Flink
    jobmanager.memory.process.size: "1248m"
    # --------------------------------------------------------------------
    # TaskManager
    # --------------------------------------------------------------------
    taskmanager.numberOfTaskSlots: "6"
    taskmanager.slot.timeout: 20s
    taskmanager.memory.process.size: "4096m"
    kubernetes.taskmanager.cpu.limit-factor: "1"
    taskmanager.network.memory.buffer-debloat.enabled: "true"
    taskmanager.network.memory.buffer-debloat.target: 5ms
    taskmanager.network.memory.buffer-debloat.min: 2kb
    taskmanager.network.memory.buffer-debloat.max: 64kb
    taskmanager.network.memory.buffer-debloat.period: 50ms
    # --------------------------------------------------------------------
    # Metrics
    # --------------------------------------------------------------------
    rest.flamegraph.enabled: "true"
    # state.backend.rocksdb.metrics.live-sst-files-size: "true"
    # state.backend.rocksdb.metrics.cur-size-all-mem-tables: "true"
  logConfiguration:
    "log4j-console.properties": |
      status = WARN
      name = Log4j2Config
      appenders = Console, Async
      # --------------------------------------------------------------------
      # Console
      # --------------------------------------------------------------------
      appender.Console.type = Console
      appender.Console.name = Console
      appender.Console.target = SYSTEM_OUT
      appender.Console.layout.type = PatternLayout
      appender.Console.layout.pattern = %d{ISO8601} %-5level [%X{flink-job-id}] [%X{symbol}] [%X{exchange}] - %msg%n
      # --------------------------------------------------------------------
      # Async
      # --------------------------------------------------------------------
      appender.Async.type = Async
      appender.Async.name = Async
      appender.Async.appenderRef.type = AppenderRef
      appender.Async.appenderRef.ref = Console
      # --------------------------------------------------------------------
      # Root
      # --------------------------------------------------------------------
      rootLogger.level = INFO
      rootLogger.appenderRef.Async.ref = Async
  jobManager:
    resource:
      memory: "1248m"
      cpu: 1.5
    podTemplate:
      spec:
        initContainers:
          - name: wait-for-schema-registry
            image: busybox:1.36
            command: ["sh", "-c", "/scripts/wait-for-schema-registry.sh"]
            volumeMounts:
              - name: wait-for-volume
                mountPath: /scripts
        securityContext:
          fsGroup: 999
        containers:
          - name: flink-main-container
            volumeMounts:
              - name: job-config-kucoin
                mountPath: /opt/flink/job-configs/kucoin
                readOnly: true
              - name: flink-volume
                mountPath: /flink-data
                readOnly: false
        volumes:
          - name: job-config-kucoin
            configMap:
              name: config-flink-job-kucoin
          - name: wait-for-volume
            configMap:
              name: wait-for-script
              defaultMode: 0755
          - name: flink-volume
            persistentVolumeClaim:
              claimName: flink-pvc
  taskManager:
    replicas: 3
    resource:
      memory: "4096m"
      cpu: 6
    podTemplate:
      spec:
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 20
                podAffinityTerm:
                  labelSelector:
                    matchLabels:
                      app: kafka-pool
                  topologyKey: kubernetes.io/hostname
        securityContext:
          fsGroup: 999
        containers:
          - name: flink-main-container
            volumeMounts:
              - name: job-config-kucoin
                mountPath: /opt/flink/job-configs/kucoin
                readOnly: true
        volumes:
          - name: job-config-kucoin
            configMap:
              name: config-flink-job-kucoin
          - name: wait-for-volume
            configMap:
              name: wait-for-script
              defaultMode: 0755
