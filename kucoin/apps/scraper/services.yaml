apiVersion: v1
kind: Service
metadata:
  name: tokio-kucoin-scraper-metrics
  namespace: backend
  labels:
    app: tokio-kucoin-scraper-metrics
spec:
  selector:
    app: tokio-kucoin-scraper
  ports:
    - protocol: TCP
      port: 9000
      targetPort: 9000
      name: tcp-prometheus
  type: ClusterIP
