apiVersion: v1
kind: ConfigMap
metadata:
  name: config-tokio-exchange-middleware
  namespace: backend
data:
  RUST_LOG: "info"
  BINANCE_EXCHANGE_INFO_URL: "https://api.binance.com/api/v3/exchangeInfo"
  BINANCE_SNAPSHOT_URL: "https://api.binance.com/api/v3/depth?limit=1000"
  BINANCE_PING_URL: "https://api.binance.com/api/v3/ping"
  KAFKA_CLIENT_ID: "binance-scraper"
  KAFKA_TOPIC: "exchange-depthSnapshot-raw"
  KAFKA_BROKER_HOST: "kafka-cluster-kafka-bootstrap.backend.svc.cluster.local:9092"
  KAFKA_CONFIG_PATH: "resources/kafka/kafka-sink-config.yaml"
  SCHEMA_REGISTRY_URL: "http://schema-registry-cluster-ip.backend.svc.cluster.local:8081"
  SYMBOL_PRIORITY_CONFIG_PATH: "resources/symbols/symbol-priority.yaml"
  TICK_INTERVAL_SECONDS: "10"
  PORT: "3000"
  METRICS_PORT: "9000"
  HISTORY_LIFETIME_SECONDS: "900"
  LIMIT_FACTOR: "0.8"
  TOKIO_WORKER_THREADS: "1"
  TOKIO_QUEUE_INTERVAL: "20"
  TOKIO_EVENT_INTERVAL: "5"
