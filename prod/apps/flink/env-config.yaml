apiVersion: v1
kind: ConfigMap
metadata:
  name: config-flink-env
  namespace: backend
data:
  KAFKA_TOPIC_BINANCE_DEPTH_UPDATE: "binance-depthUpdate-raw"
  KAFKA_TOPIC_BINANCE_MICROSTRUCTURE: "binance-microstructure-raw"
  KAFKA_TOPIC_EXCHANGE_DEPTH_SNAPSHOT: "exchange-depthSnapshot-raw"
  KAFKA_BOOTSTRAP_SERVERS: "kafka-cluster-kafka-bootstrap.backend.svc.cluster.local:9092"
  KAFKA_SOURCE_PROPS_PATH: "/opt/flink/kafka-config/kafka-source.properties"
  KAFKA_SINK_PROPS_PATH: "/opt/flink/kafka-config/kafka-sink.properties"
  SCHEMA_REGISTRY_URL: "http://schema-registry-cluster-ip.backend.svc.cluster.local:8081"
  JAVA_TOOL_OPTIONS: "--add-opens: java.base/java.util: ALL-UNNAMED"
  MAX_GAPS_BEFORE_SNAPSHOT: "2"
  MAX_SNAPSHOT_REQUESTS_IN_SYNC: "3"
  MAX_SNAPSHOT_REQUESTS_RETRY: "3"
  ORDER_BOOK_MIN_DEPTH_PERCENT: "25"
  ORDER_BOOK_SNAPSHOT_DEPTH: "1000"
  TIMEOUT_SNAPSHOT_REQUEST_SECONDS: "10"
  FLINK_PIPELINE_PROPS_PATH: "/opt/flink/pipeline-config/flink-pipeline.properties"
  ENABLE_EXTRACTION_VERBOSE: "false"
  ENABLE_ORDERBOOK_VERBOSE: "true"
  TRACKED_SYMBOLS: "FLOKIUSDT"
  SNAPSHOT_REQUEST_URL: "http://localhost:3000/request/snapshot"
