apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: kafka-broker-controller-pool
  namespace: backend
  labels:
    strimzi.io/cluster: kafka-cluster
    app: kafka-pool
spec:
  replicas: 2
  storage:
    type: persistent-claim
    size: 20Gi
    class: kafka-storage
    kraftMetadata: shared
  roles:
    - controller
    - broker
  template:
    pod:
      volumes:
        - name: pyroscope
          emptyDir: {}
      initContainers:
        - name: download-pyroscope
          image: curlimages/curl:8.2.1
          command:
            - sh
            - -c
            - >
              curl -L -o /pyroscope/pyroscope.jar \
              https://github.com/grafana/pyroscope-java/releases/download/v2.1.2/pyroscope.jar
          volumeMounts:
            - name: pyroscope
              mountPath: /pyroscope
    kafkaContainer:
      volumeMounts:
        - name: pyroscope
          mountPath: /pyroscope
      env:
        - name: JAVA_TOOL_OPTIONS
          value: "-javaagent:/pyroscope/pyroscope.jar"
        - name: PYROSCOPE_SERVER_ADDRESS
          value: http://pyroscope.backend.svc.cluster.local:4040
        - name: PYROSCOPE_APPLICATION_NAME
          value: kafka-broker
        - name: PYROSCOPE_PROFILING_INTERVAL
          value: "10ms"
        - name: "PYROSCOPE_LOG_LEVEL"
          value: "info"
  resources:
    requests:
      memory: 6Gi
      cpu: "3.5"
    limits:
      memory: 5Gi
      cpu: "4"
  jvmOptions:
    -Xms: 1638m
    -Xmx: 1638m
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: kafka-controller-only-pool
  namespace: backend
  labels:
    strimzi.io/cluster: kafka-cluster
    app: kafka-pool
spec:
  replicas: 1
  storage:
    type: persistent-claim
    size: 5Gi
    class: kafka-storage
  roles:
    - controller
  resources:
    requests:
      memory: 1Gi
      cpu: "0.5"
    limits:
      memory: 1Gi
      cpu: "1.5"
  jvmOptions:
    -Xms: 512m
    -Xmx: 512m
