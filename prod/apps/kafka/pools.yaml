apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: kafka-broker-controller-pool
  namespace: backend
  labels:
    strimzi.io/cluster: kafka-cluster
    app: kafka-pool
spec:
  replicas: 2
  storage:
    type: persistent-claim
    size: 20Gi
    class: kafka-storage
    kraftMetadata: shared
  roles:
    - controller
    - broker
  template:
    kafkaContainer:
      image: docker.io/charlescol01/kafka-docker-custom:0.0.2
      env:
        - name: JAVA_TOOL_OPTIONS
          value: >
            -javaagent:/opt/pyroscope/pyroscope.jar
            -XX:+UnlockDiagnosticVMOptions
            -XX:+DebugNonSafepoints
        - name: PYROSCOPE_SERVER_ADDRESS
          value: http://pyroscope.backend.svc.cluster.local:4040
        - name: PYROSCOPE_APPLICATION_NAME
          value: kafka-broker-$(STRIMZI_BROKER_ID)
        - name: PYROSCOPE_PROFILING_INTERVAL
          value: "20ms"
        - name: PYROSCOPE_LOG_LEVEL
          value: "info"
  resources:
    requests:
      memory: 6Gi
      cpu: "3.5"
    limits:
      memory: 5Gi
      cpu: "4"
  jvmOptions:
    -Xms: 1638m
    -Xmx: 1638m
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: kafka-controller-only-pool
  namespace: backend
  labels:
    strimzi.io/cluster: kafka-cluster
    app: kafka-pool
spec:
  replicas: 1
  storage:
    type: persistent-claim
    size: 5Gi
    class: kafka-storage
  roles:
    - controller
  resources:
    requests:
      memory: 1Gi
      cpu: "0.5"
    limits:
      memory: 1Gi
      cpu: "1.5"
  jvmOptions:
    -Xms: 512m
    -Xmx: 512m
