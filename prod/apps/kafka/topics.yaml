apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: binance-depthupdate-raw
  namespace: backend
  labels:
    strimzi.io/cluster: kafka-cluster
spec:
  topicName: binance-depthUpdate-raw
  partitions: 2
  replicas: 2
  config:
    log.retention.minutes: 15
    log.retention.bytes: -1
    log.flush.offset.checkpoint.interval.ms: 0
    log.cleanup.policy: "delete"
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: binance-microstructure-raw
  namespace: backend
  labels:
    strimzi.io/cluster: kafka-cluster
spec:
  topicName: binance-microstructure-raw
  partitions: 28
  replicas: 2
  config:
    log.retention.minutes: 45
    log.retention.bytes: -1
    log.flush.offset.checkpoint.interval.ms: 1000
    log.cleanup.policy: "delete"
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: schemas
  namespace: backend
  labels:
    strimzi.io/cluster: kafka-cluster
spec:
  topicName: _schemas
  partitions: 1
  replicas: 2
  config:
    log.cleanup.policy: "compact"
    retention.ms: -1
