kind: ConfigMap
apiVersion: v1
metadata:
  name: kafka-metrics
  namespace: backend
  labels:
    app: strimzi
data:
  kafka-metrics-config.yml: |
    # JMX Exporter – configuration ciblée
    lowercaseOutputName: true
    cache_duration_seconds: 10     

    includeObjectNames:
      # ─── JVM ────────────────────────────────────────────────────────────────
      - 'java.lang:type=GarbageCollector,name=*'
      - 'java.lang:type=MemoryPool,name=*'
      - 'java.lang:type=OperatingSystem'
      - 'java.lang:type=Threading'

      # ─── Kafka log (offset & size) ─────────────────────────────────────────
      - 'kafka.log:type=Log,name=LogEndOffset,topic=*,partition=*'
      - 'kafka.log:type=Log,name=Size,topic=*,partition=*'

      # ─── Request latency & queues ──────────────────────────────────────────
      - 'kafka.network:type=RequestMetrics,name=RequestQueueTimeMs,request=*'
      - 'kafka.network:type=RequestChannel,name=RequestQueueSize'
      - 'kafka.network:type=RequestChannel,name=ResponseQueueSize'
      - 'kafka.network:type=SocketServer,name=NetworkProcessorAvgIdlePercent,*'

      # ─── Replica, controller, cluster health ──────────────────────────────
      - 'kafka.server:type=ReplicaManager,name=LeaderCount'
      - 'kafka.server:type=ReplicaManager,name=PartitionCount'
      - 'kafka.cluster:type=Partition,name=UnderMinIsr'
      - 'kafka.controller:type=KafkaController,name=ActiveControllerCount'
      - 'kafka.controller:type=KafkaController,name=OfflinePartitionsCount'

      # ─── BrokerTopicMetrics (I/O & erreurs) ───────────────────────────────
      - 'kafka.server:type=BrokerTopicMetrics,name=BytesInPerSec,*'
      - 'kafka.server:type=BrokerTopicMetrics,name=MessagesInPerSec,*'
      - 'kafka.server:type=BrokerTopicMetrics,name=FailedFetchRequestsPerSec,*'
      - 'kafka.server:type=BrokerTopicMetrics,name=FailedProduceRequestsPerSec,*'
      - 'kafka.server:type=BrokerTopicMetrics,name=TotalFetchRequestsPerSec,*'
      - 'kafka.server:type=BrokerTopicMetrics,name=TotalProduceRequestsPerSec,*'

      # ─── KRaft / Raft ─────────────────────────────────────────────────────
      - 'kafka.server:type=raft-metrics,*'
      - 'kafka.server:type=raft-channel-metrics,*'

      # ─── Connexions réseau ────────────────────────────────────────────────
      - 'kafka.server:type=socket-server-metrics,*'

      # ─── Disk I/O (Linux) ─────────────────────────────────────────────────
      - 'kafka.server:type=KafkaServer,name=linux-disk-*'

    rules:
      # ─── GC (ms → s) ──────────────────────────────────────────────────────
      - pattern: 'java.lang<type=GarbageCollector, name=(.+)><>CollectionTime'
        name: jvm_gc_collection_seconds_sum
        type: COUNTER
        labels:
          gc: "$1"
        valueFactor: 0.001
      - pattern: 'java.lang<type=GarbageCollector, name=(.+)><>CollectionCount'
        name: jvm_gc_collection_seconds_count
        type: COUNTER
        labels:
          gc: "$1"

      # ─── Mémoire JVM ──────────────────────────────────────────────────────
      - pattern: 'java.lang<type=MemoryPool, name=(.+)><>Usage.used'
        name: jvm_memory_used_bytes
        type: GAUGE
        labels:
          pool: "$1"
      - pattern: 'java.lang<type=MemoryPool, name=(.+)><>Usage.max'
        name: jvm_memory_max_bytes
        type: GAUGE
        labels:
          pool: "$1"

      # ─── FDs & threads ────────────────────────────────────────────────────
      - pattern: 'java.lang<type=OperatingSystem><>OpenFileDescriptorCount'
        name: process_open_fds
        type: GAUGE
      - pattern: 'java.lang<type=OperatingSystem><>MaxFileDescriptorCount'
        name: process_max_fds
        type: GAUGE
      - pattern: 'java.lang<type=Threading><>ThreadCount'
        name: jvm_threads_current
        type: GAUGE

      # ─── Offsets & tailles de log ─────────────────────────────────────────
      - pattern: 'kafka.log<type=Log, name=LogEndOffset, topic=(.+), partition=(.+)><>Value'
        name: kafka_log_log_logendoffset
        type: GAUGE
        labels:
          topic: "$1"
          partition: "$2"
      - pattern: 'kafka.log<type=Log, name=Size, topic=(.+), partition=(.+)><>Value'
        name: kafka_log_log_size
        type: GAUGE
        labels:
          topic: "$1"
          partition: "$2"

      # ─── Latences / files d’attente ───────────────────────────────────────
      - pattern: 'kafka.network<type=RequestMetrics, name=RequestQueueTimeMs, request=(.+)><>(\d+)thPercentile'
        name: kafka_network_requestmetrics_requestqueuetimems
        type: GAUGE
        labels:
          request: "$1"
          quantile: "0.$2"
      - pattern: 'kafka.network<type=RequestChannel, name=RequestQueueSize><>Value'
        name: kafka_network_requestchannel_requestqueuesize
        type: GAUGE
      - pattern: 'kafka.network<type=RequestChannel, name=ResponseQueueSize><>Value'
        name: kafka_network_requestchannel_responsequeuesize
        type: GAUGE
      - pattern: 'kafka.network<type=SocketServer, name=NetworkProcessorAvgIdlePercent, listener=(.+), networkProcessor=(.+)><>Value'
        name: kafka_network_socketserver_networkprocessoravgidle_percent
        type: GAUGE
        labels:
          listener: "$1"
          networkProcessor: "$2"

      # ─── Replica manager & controller ─────────────────────────────────────
      - pattern: 'kafka.server<type=ReplicaManager, name=(LeaderCount|PartitionCount)><>Value'
        name: kafka_server_replicamanager_$1
        type: GAUGE
      - pattern: 'kafka.cluster<type=Partition, name=UnderMinIsr><>Value'
        name: kafka_cluster_partition_atminisr
        type: GAUGE
      - pattern: 'kafka.controller<type=KafkaController, name=(ActiveControllerCount|OfflinePartitionsCount)><>Value'
        name: kafka_controller_kafkacontroller_$1
        type: GAUGE

      # ─── BrokerTopicMetrics ───────────────────────────────────────────────
      - pattern: 'kafka.server<type=BrokerTopicMetrics, name=(BytesInPerSec|MessagesInPerSec|FailedFetchRequestsPerSec|FailedProduceRequestsPerSec|TotalFetchRequestsPerSec|TotalProduceRequestsPerSec), topic=(.+)><>Count'
        name: kafka_server_brokertopicmetrics_$1_total
        type: COUNTER
        labels:
          topic: "$2"
      - pattern: 'kafka.server<type=BrokerTopicMetrics, name=(BytesInPerSec|MessagesInPerSec|FailedFetchRequestsPerSec|FailedProduceRequestsPerSec|TotalFetchRequestsPerSec|TotalProduceRequestsPerSec)><>Count'
        name: kafka_server_brokertopicmetrics_$1_total
        type: COUNTER

      # ─── Raft & Raft-channel ──────────────────────────────────────────────
      - pattern: 'kafka.server<type=raft-metrics><>(.+-total|.+-max)'
        name: kafka_server_raftmetrics_$1
        type: COUNTER
      - pattern: 'kafka.server<type=raft-metrics><>(.+)'
        name: kafka_server_raftmetrics_$1
        type: GAUGE
      - pattern: 'kafka.server<type=raft-channel-metrics><>(.+-total|.+-max)'
        name: kafka_server_raftchannelmetrics_$1
        type: COUNTER
      - pattern: 'kafka.server<type=raft-channel-metrics><>(.+)'
        name: kafka_server_raftchannelmetrics_$1
        type: GAUGE

      # ─── Connexions réseau ────────────────────────────────────────────────
      - pattern: 'kafka.server<type=socket-server-metrics, listener=(.+), networkProcessor=(.+)><>ConnectionCount'
        name: kafka_server_socket_server_metrics_connection_count
        type: GAUGE
        labels:
          listener: "$1"
          networkProcessor: "$2"

      # ─── Disk I/O (Linux) ─────────────────────────────────────────────────
      - pattern: 'kafka.server<type=KafkaServer, name=(linux-disk-read-bytes|linux-disk-write-bytes), pod=(.+)><>Count'
        name: kafka_server_kafkaserver_$1
        type: COUNTER
        labels:
          pod: "$2"
