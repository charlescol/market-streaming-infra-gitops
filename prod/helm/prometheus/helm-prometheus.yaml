apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus
  namespace: flux-system
spec:
  interval: 1h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: flux-system
spec:
  releaseName: prometheus
  targetNamespace: backend
  interval: 1h
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 69.8.2
      sourceRef:
        kind: HelmRepository
        name: prometheus
        namespace: flux-system
  values:
    kubelet:
      enabled: true
      serviceMonitor:
        kubelet: true
        cAdvisor: true
        cAdvisorInterval: 10s
    alertmanager:
      enabled: false
    pushgateway:
      enabled: false
    prometheus:
      prometheusSpec:
        serviceMonitorSelectorNilUsesHelmValues: true
        serviceMonitorNamespaceSelector: {}
        retention: 1d
    grafana:
      enabled: true
      defaultDashboardsEnabled: false
      resources:
        requests:
          cpu: "200m"
          memory: "256Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"
      sidecar:
        dashboards:
          provider:
            allowUiUpdates: true
      persistence:
        enabled: true
        type: pvc
        existingClaim: gce-pvc
        accessModes:
          - ReadWriteOnce
        size: 5Gi
      replicas: 1
