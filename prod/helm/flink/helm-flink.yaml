apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: flink-operator
  namespace: flux-system
spec:
  interval: 1h
  url: https://dlcdn.apache.org/flink/flink-kubernetes-operator-1.12.1/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flink-operator
  namespace: flux-system
spec:
  releaseName: flink-operator
  targetNamespace: backend
  interval: 1h
  chart:
    spec:
      chart: flink-kubernetes-operator
      version: 1.12.1
      sourceRef:
        kind: HelmRepository
        name: flink-operator
        namespace: flux-system
  values:
    webhook:
      create: true
    metrics:
      port: 8083
    defaultConfiguration:
      create: true
      append: true
