apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-scrapers
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./prod/apps/scrapers
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: app-schema-registry
    - name: app-kafka
    - name: app-flink
    - name: app-exchange-middleware
