apiVersion: batch/v1
kind: Job
metadata:
  name: init-schema-registry
  namespace: backend
spec:
  ttlSecondsAfterFinished: 300 # Auto-cleanup after 5 minutes
  template:
    spec:
      backoffLimit: 3
      restartPolicy: Never
      initContainers:
        - name: wait-for-schema-registry
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z schema-registry-cluster-ip.backend.svc.cluster.local 8081; do
                echo "Waiting for Schema Registry...";
                sleep 5;
              done
      containers:
        - name: init-schema-registry
          image: asia-northeast1-docker.pkg.dev/market-streaming-prod/init-schema-registry/init-schema-registry:0.8.5 # {"$imagepolicy": "flux-system:init-schema-registry"}
          command: ["sh", "-c"]
          args: ["node dist/build-schemas.js && node dist/publish-schemas.js"]
          env:
            - name: SCHEMA_REGISTRY_URL
              value: http://schema-registry-cluster-ip.backend.svc.cluster.local:8081
