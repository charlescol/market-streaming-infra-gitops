apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-scraper
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./binance/apps/scraper
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: app-schema-registry
    - name: app-kafka
    - name: app-flink
    - name: app-middleware
    # - name: app-tokio-binance-mock
