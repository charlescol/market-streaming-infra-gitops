apiVersion: apps/v1
kind: Deployment
metadata:
  name: tokio-binance-mock
  namespace: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tokio-binance-mock
  template:
    metadata:
      labels:
        app: tokio-binance-mock
    spec:
      imagePullSecrets:
        - name: flux-gcp-key
      containers:
        - name: tokio
          image: asia-northeast1-docker.pkg.dev/market-streaming-prod/tokio-binance-mock/tokio-binance-mock:0.0.2 # {"$imagepolicy": "flux-system:msv-tokio-binance-mock"}
          ports:
            - containerPort: 9000
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: config-tokio-binance-mock
          volumeMounts:
            - name: tokio-symbols-volume
              mountPath: /app/resources/symbols
              readOnly: true
          resources:
            requests:
              cpu: "1"
              memory: 500Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: tokio-symbols-volume
          configMap:
            name: config-tokio-symbols
