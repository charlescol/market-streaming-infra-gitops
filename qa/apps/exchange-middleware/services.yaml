apiVersion: v1
kind: Service
metadata:
  name: tokio-exchange-middleware-metrics
  namespace: backend
  labels:
    app: tokio-exchange-middleware-metrics
spec:
  selector:
    app: tokio-exchange-middleware
  ports:
    - protocol: TCP
      port: 9000
      targetPort: 9000
      name: tcp-prometheus
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: tokio-exchange-middleware-http
  namespace: backend
  labels:
    app: tokio-exchange-middleware-http
spec:
  selector:
    app: tokio-exchange-middleware
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      name: tcp-http
  type: ClusterIP
