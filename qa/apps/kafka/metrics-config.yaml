kind: ConfigMap
apiVersion: v1
metadata:
  name: kafka-metrics
  namespace: backend
  labels:
    app: strimzi
data:
  kafka-metrics-config.yml: |
    # JMX Exporter – configuration ciblée
    lowercaseOutputName: true
    cache_duration_seconds: 10     

    includeObjectNames:
      # ─── JVM ────────────────────────────────────────────────────────────────
      - 'java.lang:type=GarbageCollector,name=*'
      - 'java.lang:type=MemoryPool,name=*'
      - 'java.lang:type=OperatingSystem'
      - 'java.lang:type=Threading'

      # ─── Kafka log (offset & size) ─────────────────────────────────────────
      - 'kafka.log:type=Log,name=LogEndOffset,topic=*,partition=*'
      - 'kafka.log:type=Log,name=Size,topic=*,partition=*'

      # ─── Request latency & queues ──────────────────────────────────────────
      - 'kafka.network:type=RequestMetrics,name=RequestQueueTimeMs,request=*'
      - 'kafka.network:type=RequestChannel,name=RequestQueueSize'
      - 'kafka.network:type=RequestChannel,name=ResponseQueueSize'
      - 'kafka.network:type=SocketServer,name=NetworkProcessorAvgIdlePercent,*'
      - 'kafka.server:type=KafkaRequestHandlerPool,name=RequestHandlerAvgIdlePercent,*' 

      # ─── Replica, controller, cluster health ──────────────────────────────
      - 'kafka.server:type=ReplicaManager,name=LeaderCount'
      - 'kafka.server:type=ReplicaManager,name=PartitionCount'
      - 'kafka.cluster:type=Partition,name=UnderMinIsr'
      - 'kafka.controller:type=KafkaController,name=ActiveControllerCount'
      - 'kafka.controller:type=KafkaController,name=OfflinePartitionsCount'

      # ─── BrokerTopicMetrics (I/O & erreurs) ───────────────────────────────
      - 'kafka.server:type=BrokerTopicMetrics,name=BytesInPerSec,*'
      - 'kafka.server:type=BrokerTopicMetrics,name=MessagesInPerSec,*'
      - 'kafka.server:type=BrokerTopicMetrics,name=FailedFetchRequestsPerSec,*'
      - 'kafka.server:type=BrokerTopicMetrics,name=FailedProduceRequestsPerSec,*'
      - 'kafka.server:type=BrokerTopicMetrics,name=TotalFetchRequestsPerSec,*'
      - 'kafka.server:type=BrokerTopicMetrics,name=TotalProduceRequestsPerSec,*'

      # ─── KRaft / Raft ─────────────────────────────────────────────────────
      - 'kafka.server:type=raft-metrics,*'
      - 'kafka.server:type=raft-channel-metrics,*'

      # ─── Connexions réseau ────────────────────────────────────────────────
      - 'kafka.server:type=socket-server-metrics,*'

      # ─── Disk I/O (Linux) ─────────────────────────────────────────────────
      - 'kafka.server:type=KafkaServer,name=linux-disk-*'

    rules:
      # Special cases and very specific rules
      - pattern: kafka.server<type=(.+), name=(.+), clientId=(.+), topic=(.+), partition=(.*)><>Value
        name: kafka_server_$1_$2
        type: GAUGE
        labels:
          clientId: "$3"
          topic: "$4"
          partition: "$5"
      - pattern: kafka.server<type=(.+), name=(.+), clientId=(.+), brokerHost=(.+), brokerPort=(.+)><>Value
        name: kafka_server_$1_$2
        type: GAUGE
        labels:
          clientId: "$3"
          broker: "$4:$5"
      - pattern: kafka.server<type=(.+), cipher=(.+), protocol=(.+), listener=(.+), networkProcessor=(.+)><>connections
        name: kafka_server_$1_connections_tls_info
        type: GAUGE
        labels:
          cipher: "$2"
          protocol: "$3"
          listener: "$4"
          networkProcessor: "$5"
      - pattern: kafka.server<type=(.+), clientSoftwareName=(.+), clientSoftwareVersion=(.+), listener=(.+), networkProcessor=(.+)><>connections
        name: kafka_server_$1_connections_software
        type: GAUGE
        labels:
          clientSoftwareName: "$2"
          clientSoftwareVersion: "$3"
          listener: "$4"
          networkProcessor: "$5"
      - pattern: "kafka.server<type=(.+), listener=(.+), networkProcessor=(.+)><>(.+-total):"
        name: kafka_server_$1_$4
        type: COUNTER
        labels:
          listener: "$2"
          networkProcessor: "$3"
      - pattern: "kafka.server<type=(.+), listener=(.+), networkProcessor=(.+)><>(.+):"
        name: kafka_server_$1_$4
        type: GAUGE
        labels:
          listener: "$2"
          networkProcessor: "$3"
      - pattern: kafka.server<type=(.+), listener=(.+), networkProcessor=(.+)><>(.+-total)
        name: kafka_server_$1_$4
        type: COUNTER
        labels:
          listener: "$2"
          networkProcessor: "$3"
      - pattern: kafka.server<type=(.+), listener=(.+), networkProcessor=(.+)><>(.+)
        name: kafka_server_$1_$4
        type: GAUGE
        labels:
          listener: "$2"
          networkProcessor: "$3"
      # Some percent metrics use MeanRate attribute
      # Ex) kafka.server<type=(KafkaRequestHandlerPool), name=(RequestHandlerAvgIdlePercent)><>MeanRate
      - pattern: kafka.(\w+)<type=(.+), name=(.+)Percent\w*><>MeanRate
        name: kafka_$1_$2_$3_percent
        type: GAUGE
      # Generic gauges for percents
      - pattern: kafka.(\w+)<type=(.+), name=(.+)Percent\w*><>Value
        name: kafka_$1_$2_$3_percent
        type: GAUGE
      - pattern: kafka.(\w+)<type=(.+), name=(.+)Percent\w*, (.+)=(.+)><>Value
        name: kafka_$1_$2_$3_percent
        type: GAUGE
        labels:
          "$4": "$5"
      # Generic per-second counters with 0-2 key/value pairs
      - pattern: kafka.(\w+)<type=(.+), name=(.+)PerSec\w*, (.+)=(.+), (.+)=(.+)><>Count
        name: kafka_$1_$2_$3_total
        type: COUNTER
        labels:
          "$4": "$5"
          "$6": "$7"
      - pattern: kafka.(\w+)<type=(.+), name=(.+)PerSec\w*, (.+)=(.+)><>Count
        name: kafka_$1_$2_$3_total
        type: COUNTER
        labels:
          "$4": "$5"
      - pattern: kafka.(\w+)<type=(.+), name=(.+)PerSec\w*><>Count
        name: kafka_$1_$2_$3_total
        type: COUNTER
      # Generic gauges with 0-2 key/value pairs
      - pattern: kafka.(\w+)<type=(.+), name=(.+), (.+)=(.+), (.+)=(.+)><>Value
        name: kafka_$1_$2_$3
        type: GAUGE
        labels:
          "$4": "$5"
          "$6": "$7"
      - pattern: kafka.(\w+)<type=(.+), name=(.+), (.+)=(.+)><>Value
        name: kafka_$1_$2_$3
        type: GAUGE
        labels:
          "$4": "$5"
      - pattern: kafka.(\w+)<type=(.+), name=(.+)><>Value
        name: kafka_$1_$2_$3
        type: GAUGE
      # Emulate Prometheus 'Summary' metrics for the exported 'Histogram's.
      # Note that these are missing the '_sum' metric!
      - pattern: kafka.(\w+)<type=(.+), name=(.+), (.+)=(.+), (.+)=(.+)><>Count
        name: kafka_$1_$2_$3_count
        type: COUNTER
        labels:
          "$4": "$5"
          "$6": "$7"
      - pattern: kafka.(\w+)<type=(.+), name=(.+), (.+)=(.*), (.+)=(.+)><>(\d+)thPercentile
        name: kafka_$1_$2_$3
        type: GAUGE
        labels:
          "$4": "$5"
          "$6": "$7"
          quantile: "0.$8"
      - pattern: kafka.(\w+)<type=(.+), name=(.+), (.+)=(.+)><>Count
        name: kafka_$1_$2_$3_count
        type: COUNTER
        labels:
          "$4": "$5"
      - pattern: kafka.(\w+)<type=(.+), name=(.+), (.+)=(.*)><>(\d+)thPercentile
        name: kafka_$1_$2_$3
        type: GAUGE
        labels:
          "$4": "$5"
          quantile: "0.$6"
      - pattern: kafka.(\w+)<type=(.+), name=(.+)><>Count
        name: kafka_$1_$2_$3_count
        type: COUNTER
      - pattern: kafka.(\w+)<type=(.+), name=(.+)><>(\d+)thPercentile
        name: kafka_$1_$2_$3
        type: GAUGE
        labels:
          quantile: "0.$4"
      # KRaft overall related metrics
      # distinguish between always increasing COUNTER (total and max) and variable GAUGE (all others) metrics
      - pattern: "kafka.server<type=raft-metrics><>(.+-total|.+-max):"
        name: kafka_server_raftmetrics_$1
        type: COUNTER
      - pattern: "kafka.server<type=raft-metrics><>(current-state): (.+)"
        name: kafka_server_raftmetrics_$1
        value: 1
        type: UNTYPED
        labels:
          $1: "$2"
      - pattern: "kafka.server<type=raft-metrics><>(.+):"
        name: kafka_server_raftmetrics_$1
        type: GAUGE
      # KRaft "low level" channels related metrics
      # distinguish between always increasing COUNTER (total and max) and variable GAUGE (all others) metrics
      - pattern: "kafka.server<type=raft-channel-metrics><>(.+-total|.+-max):"
        name: kafka_server_raftchannelmetrics_$1
        type: COUNTER
      - pattern: "kafka.server<type=raft-channel-metrics><>(.+):"
        name: kafka_server_raftchannelmetrics_$1
        type: GAUGE
      # Broker metrics related to fetching metadata topic records in KRaft mode
      - pattern: "kafka.server<type=broker-metadata-metrics><>(.+):"
        name: kafka_server_brokermetadatametrics_$1
        type: GAUGE
