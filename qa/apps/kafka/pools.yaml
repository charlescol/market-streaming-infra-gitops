apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: kafka-broker-controller-pool
  namespace: backend
  labels:
    strimzi.io/cluster: kafka-cluster
    app: kafka-pool
spec:
  replicas: 3
  storage:
    type: persistent-claim
    size: 20Gi
    class: kafka-storage
    kraftMetadata: shared
  roles:
    - controller
    - broker
  resources:
    requests:
      memory: 5Gi
      cpu: "3"
    limits:
      memory: 5Gi
      cpu: "5"
  jvmOptions:
    -Xms: "1638m"
    -Xmx: "1638m"
    -XX:
      UseG1GC: "true"
      MaxGCPauseMillis: "10"
      InitiatingHeapOccupancyPercent: "30"
      ExplicitGCInvokesConcurrent: "true"
      ParallelGCThreads: "2"
      ConcGCThreads: "2"
      AlwaysPreTouch: "true"
