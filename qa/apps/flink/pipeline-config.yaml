apiVersion: v1
kind: ConfigMap
metadata:
  name: config-flink-pipeline
  namespace: backend
data:
  flink-pipeline.properties: |
    parallelism.source.depthupdate=2
    parallelism.source.snapshot=1
    parallelism.orderbook=5
    parallelism.metrics.extraction1=3
    parallelism.metrics.extraction2=3
    parallelism.metrics.extraction3=1
    parallelism.sink=4
