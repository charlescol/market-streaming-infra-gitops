apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: kafka-broker-controller-pool
  namespace: backend
  labels:
    strimzi.io/cluster: kafka-cluster
    app: kafka-pool
spec:
  replicas: 3
  roles:
    - controller
    - broker
  storage:
    type: persistent-claim
    size: 350Gi
    class: local-ssd
    kraftMetadata: shared
  resources:
    requests:
      memory: 9Gi
      cpu: "4.5"
    limits:
      memory: 12Gi
      cpu: "6"
  jvmOptions:
    -Xms: "2048m"
    -Xmx: "2048m"
  template:
    pod:
      tolerations:
        - key: "local-ssd"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"

      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: pool
                    operator: In
                    values:
                      - ssd

        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: strimzi.io/cluster
                    operator: In
                    values:
                      - kafka-cluster
              topologyKey: kubernetes.io/hostname
