apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: kafka-combined-pool
  namespace: backend
  labels:
    strimzi.io/cluster: kafka-cluster
    app: kafka-pool
spec:
  replicas: 1
  storage:
    type: ephemeral
    sizeLimit: 1Gi
    kraftMetadata: shared
  roles:
    - controller
    - broker
  resources:
    requests:
      memory: 512Mi
      cpu: "0.5"
    limits:
      memory: 512Mi
      cpu: "0.5"
