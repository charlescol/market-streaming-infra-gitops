apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-init
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: node-init
  template:
    metadata:
      labels:
        app: node-init
    spec:
      hostPID: true
      containers:
        - name: ensure-path
          image: busybox:1.36
          securityContext:
            privileged: true
          command:
            - sh
            - -c
            - |
              mkdir -p /host/mnt/disks/flink && \
              chown 999:999 /host/mnt/disks/flink && \
              chmod 770 /host/mnt/disks/flink; \
              echo "Bootstrapping done"
              sleep infinity
          volumeMounts:
            - name: host-mnt
              mountPath: /host/mnt
          resources:
            requests:
              cpu: 5m
              memory: 10Mi
            limits:
              cpu: 10m
              memory: 20Mi
      volumes:
        - name: host-mnt
          hostPath:
            path: /mnt
            type: Directory
