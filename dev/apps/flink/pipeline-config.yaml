apiVersion: v1
kind: ConfigMap
metadata:
  name: config-flink-pipeline
  namespace: backend
data:
  flink-pipeline.yaml: |
    source:
      depthupdate:
        parallelism: 2
        sharing-group: "default"
      snapshot:
        parallelism: 1
        sharing-group: "default"
    orderbook:
      parallelism: 3
      sharing-group: "orderbook-group"
    metrics:
      extraction1:
        parallelism: 2
        sharing-group: "feature1"
      extraction2:
        parallelism: 2
        sharing-group: "feature2"
      extraction3:
        parallelism: 2
        sharing-group: "feature3"
    sink:
      parallelism: 3
      sharing-group: "sink-group"
