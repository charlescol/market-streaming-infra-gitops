apiVersion: v1
kind: ConfigMap
metadata:
  name: config-tokio-binance-scraper
  namespace: backend
data:
  RUST_LOG: "info"
  ENABLE_METRICS_VERBOSE: "true"
  KAFKA_CLIENT_ID: "binance-scraper"
  KAFKA_TOPIC: "binance-depthUpdate-raw"
  KAFKA_BROKER_HOST: "kafka-cluster-kafka-bootstrap.backend.svc.cluster.local:9092"
  KAFKA_CONFIG_PATH: "resources/kafka/kafka-sink-config.yaml"
  SYMBOL_CONFIG_PATH: "resources/symbols/symbols-config.yaml"
  SCHEMA_REGISTRY_URL: "http://schema-registry-cluster-ip.backend.svc.cluster.local:8081"
  BINANCE_WS_HOST: "stream-sbe.binance.com"
  BINANCE_WS_PORT: "9443"
  BINANCE_WS_FORMAT: "sbe"
  ENABLE_SCRAPER: "true"
  SOURCE_TLS: "true"
  TRACKED_SYMBOLS: "FLOKIUSDT,ETHUSDT,BTCFDUSD,BONKUSKT,BTCUSDT,SOLUSDT,ETHFDUSD,XRPUSDT,TSTUSDT,ENAUSDT,DOGEUSDT,BNBUSDT,SOLFDUSD,LTCUSDT,BNBFDUSD,PROVEUSDT,DOGEFDUSD,ETHUSDC"
  MONITOR_RDKAFKA: "true"
  MONITOR_COUNT: "50"
  METRICS_PORT: "9000"
  TOKIO_WORKER_THREADS: "4"
  TOKIO_QUEUE_INTERVAL: "5"
  TOKIO_EVENT_INTERVAL: "5"
  PROCESS_QUEUE_CAPACITY: "50"
  STREAM_GROUP_COUNT: "200"
  PROCESS_GROUP_COUNT: "450"
  MAX_INFLIGHT_BY_PROCESS_GROUP: "30"
  MONITOR_RATIO: "0.1"
