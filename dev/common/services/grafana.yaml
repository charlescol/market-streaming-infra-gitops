apiVersion: v1
kind: Service
metadata:
  name: grafana-lb
  namespace: backend
spec:
  type: LoadBalancer
  loadBalancerIP: 35.194.99.139
  externalTrafficPolicy: Local
  healthCheckNodePort: 32080
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: https
      port: 443
      targetPort: 3000
      protocol: TCP
      nodePort: 31853
