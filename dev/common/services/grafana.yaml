apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: backend
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 3000
  selector:
    app.kubernetes.io/name: grafana
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: backend
  annotations:
    kubernetes.io/ingress.class: "gce"
spec:
  defaultBackend:
    service:
      name: grafana
      port:
        number: 80
