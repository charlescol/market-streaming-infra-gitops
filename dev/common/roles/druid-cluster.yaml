apiVersion: v1
kind: ServiceAccount
metadata:
  name: druid-sa
  namespace: backend
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: druid-role
  namespace: backend
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - configmaps
    verbs:
      - "*"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: druid-rolebinding
  namespace: backend
subjects:
  - kind: ServiceAccount
    name: druid-sa
    namespace: backend
roleRef:
  kind: Role
  name: druid-role
  apiGroup: rbac.authorization.k8s.io
