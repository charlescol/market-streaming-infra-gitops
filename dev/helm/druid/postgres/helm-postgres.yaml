apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: bitnami-oci
  namespace: flux-system
spec:
  interval: 1h
  type: oci
  url: oci://registry-1.docker.io/bitnamicharts
---
apiVersion: v1
kind: Secret
metadata:
  name: druid-pg-auth
  namespace: backend
type: Opaque
stringData:
  postgres-password: "postgres"
  password: "druid"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: druid-postgres
  namespace: flux-system
spec:
  releaseName: druid-postgres
  targetNamespace: backend
  interval: 1h
  install:
    createNamespace: true
  chart:
    spec:
      chart: postgresql
      version: 16.7.27
      sourceRef:
        kind: HelmRepository
        name: bitnami-oci
        namespace: flux-system
  values:
    global:
      imagePullSecrets:
        - name: dockerhub-creds
    architecture: standalone
    auth:
      enablePostgresUser: true
      username: druid
      database: druid
      existingSecret: druid-pg-auth
      secretKeys:
        adminPasswordKey: postgres-password
        userPasswordKey: password
    primary:
      persistence:
        enabled: true
        storageClass: default-storage
        size: 10Gi
        accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1Gi
      extendedConfiguration: |
        max_connections = 200
        shared_buffers = 512MB
        effective_cache_size = 1536MB
        maintenance_work_mem = 128MB
        checkpoint_timeout = '10min'
        wal_compression = on
      livenessProbe:
        enabled: true
        initialDelaySeconds: 30
      readinessProbe:
        enabled: true
        initialDelaySeconds: 10
    volumePermissions:
      enabled: true
    service:
      type: ClusterIP
      ports:
        postgresql: 5432
    networkPolicy:
      enabled: true
      allowExternal: false
      ingressNSMatchLabels:
        kubernetes.io/metadata.name: backend
    metrics:
      enabled: false
