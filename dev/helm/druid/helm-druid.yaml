apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: druid-operator
  namespace: flux-system
spec:
  interval: 1h
  url: https://charts.datainfra.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: druid-operator
  namespace: flux-system
spec:
  releaseName: druid-operator
  targetNamespace: backend
  interval: 1h
  chart:
    spec:
      chart: druid-operator
      version: 0.3.9
      sourceRef:
        kind: HelmRepository
        name: druid-operator
        namespace: flux-system
