apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus
  namespace: flux-system
spec:
  interval: 1h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: flux-system
spec:
  releaseName: prometheus
  targetNamespace: backend
  interval: 1h
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 69.8.2
      sourceRef:
        kind: HelmRepository
        name: prometheus
        namespace: flux-system
  values:
    kubelet:
      enabled: true
      serviceMonitor:
        kubelet: true
        cAdvisor: true
        cAdvisorInterval: 10s
    alertmanager:
      enabled: false
    pushgateway:
      enabled: false
    prometheus:
      prometheusSpec:
        serviceMonitorSelectorNilUsesHelmValues: true
        serviceMonitorNamespaceSelector: {}
        retention: 1d
    grafana:
      enabled: true
      grafana.ini:
        server:
          protocol: http
          http_addr: 0.0.0.0
          http_port: 3000
          root_url: https://grafana.charlescolella.com/
      service:
        annotations:
          cloud.google.com/neg: '{"ingress": true}'
          beta.cloud.google.com/backend-config: '{"default":"grafana-backendconfig"}'
        portName: http

      plugins:
        - grafadruid-druid-datasource

      defaultDashboardsEnabled: false
      additionalDataSources:
        - name: Pyroscope
          type: pyroscope
          access: proxy
          url: http://pyroscope.backend.svc.cluster.local:4040

        - name: Druid
          type: grafadruid-druid-datasource
          access: proxy
          url: http://druid-cluster-routers.backend.svc.cluster.local:8088
          jsonData:
            druidQueryType: sql
            timeout: 120
            maxRows: 5000
          editable: true
      resources:
        requests:
          cpu: "400m"
          memory: "256Mi"
        limits:
          cpu: "1"
          memory: "512Mi"
      sidecar:
        dashboards:
          provider:
            allowUiUpdates: true
      persistence:
        enabled: true
        type: pvc
        existingClaim: gce-pvc
        accessModes:
          - ReadWriteOnce
        size: 5Gi
      replicas: 1
